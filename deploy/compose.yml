name: concrete-dominion
services:
  api:
    image: concrete-dominion-api:${CD_RELEASE:-local}
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 30s
    environment:
      CD_DATABASE: ${CD_DATABASE:-/data/concrete_dominion.sqlite}
      CD_PLAYTEST_KEY_FILE: /run/secrets/playtest_key
    secrets: [playtest_key]
    volumes: [game_data:/data]
    tmpfs: ['/tmp:size=16m,mode=1777']
    networks: [backend]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      options: {max-size: 10m, max-file: '3'}
  proxy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    ports:
      - '${CD_HTTP_BIND:-80}:80'
      - '${CD_HTTPS_BIND:-443}:443'
    environment:
      CD_DOMAIN: ${CD_DOMAIN:?Set CD_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, backend]
    logging:
      options: {max-size: 10m, max-file: '3'}
secrets:
  playtest_key:
    file: ${CD_PLAYTEST_KEY_PATH:-./secrets/playtest_key}
networks:
  edge:
  backend:
    internal: true
volumes:
  game_data:
  caddy_data:
  caddy_config:
