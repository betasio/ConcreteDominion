name: Godot QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    name: Headless validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test multiplayer API authorization and persistence
        run: python3 -m unittest server.test_app server.test_security server.test_http server.test_pvp_concurrency tools.test_premium_assets -v

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify engine
        run: godot --version

      - name: Import project
        run: |
          set -o pipefail
          godot --headless --path . --import --quit 2>&1 | tee godot-import.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" godot-import.log

      - name: Compile/load all project resources
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/ProjectResourceAudit.tscn 2>&1 | tee godot-resources.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" godot-resources.log

      - name: Validate game data
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/DataValidation.tscn 2>&1 | tee godot-data.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" godot-data.log

      - name: Run deterministic balance audit
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/BalanceAudit.tscn 2>&1 | tee godot-balance.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" godot-balance.log

      - name: Run smoke test
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/SmokeTest.tscn 2>&1 | tee godot-smoke.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" godot-smoke.log

      - name: Audit runtime art coverage
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/ArtCoverageAudit.tscn 2>&1 | tee godot-art.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" godot-art.log

      - name: Run gameplay regression audit
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/tests/GameplayRegressionAudit.tscn 2>&1 | tee godot-regression.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" godot-regression.log

      - name: Capture real turf screenshot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          mkdir -p build/previews
          xvfb-run -a godot --path . --rendering-driver opengl3 res://scenes/tests/TurfScreenshot.tscn
          test -s build/previews/turf_actual.png

      - name: Upload real turf screenshot
        uses: actions/upload-artifact@v4
        with:
          name: concrete-dominion-turf-screenshot
          path: build/previews/turf_actual.png
          if-no-files-found: error

      - name: Prepare export directories
        run: mkdir -p build/windows build/android

      - name: Export Windows debug build
        run: |
          set -o pipefail
          godot --headless --path . --export-debug "Windows Desktop" build/windows/ConcreteDominion.exe 2>&1 | tee godot-windows-export.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" godot-windows-export.log

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Prepare Android SDK
        run: |
          sdkmanager "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Export Android debug APK
        run: |
          set -o pipefail
          godot --headless --path . --export-debug "Android" build/android/ConcreteDominion.apk 2>&1 | tee godot-android-export.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" godot-android-export.log

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: concrete-dominion-windows-debug
          path: build/windows/**
          if-no-files-found: error

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: concrete-dominion-android-debug
          path: build/android/ConcreteDominion.apk
          if-no-files-found: error
